<!DOCTYPE html><html><head><title>Mouse Events</title><style>#image{width:350px;height:230px;object-fit:cover}#text2{display:none}</style></head><body><div id="a"><img id="image" src="https://upload.wikimedia.org/wikipedia/commons/d/da/Taj-Mahal.jpg" alt="Taj Mahal"><br><h2 id="text1">Taj Mahal, Agra</h2><h2 id="text2">The Colosseum, Rome</h2></div><script>const box=document.getElementById('a');box.addEventListener('mouseover',()=>{document.getElementById('image').src='https://upload.wikimedia.org/wikipedia/commons/d/de/Colosseo_2020.jpg';document.getElementById('text1').style.display='none';document.getElementById('text2').style.display='block'});box.addEventListener('mouseout',()=>{document.getElementById('image').src='https://upload.wikimedia.org/wikipedia/commons/d/da/Taj-Mahal.jpg';document.getElementById('text1').style.display='block';document.getElementById('text2').style.display='none'});</script></body></html>
