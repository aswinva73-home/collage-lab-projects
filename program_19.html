<!DOCTYPE html><html><head><title>Registration Form</title></head><body><h1>Registration form</h1><form id="reg">Username: <input id="username" required><br><br>Email: <input type="email" id="email" required><br><br>Password: <input type="password" id="pass" required><br><br>Confirm password: <input type="password" id="cpass" required><br><br><button type="submit">Register</button></form><p id="msg"></p><script>document.getElementById('reg').addEventListener('submit',function(e){e.preventDefault();if(document.getElementById('pass').value!==document.getElementById('cpass').value){document.getElementById('msg').textContent='Password and confirm password should match';return}document.getElementById('msg').textContent='Form validated successfully (HTML-only demo; no server/database).'});</script></body></html>
