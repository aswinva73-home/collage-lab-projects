<!DOCTYPE html>
<html>

<head>
    <title>Student Names Array</title>
</head>

<body>
    <h2>Student Names</h2>
    <p id="original"></p>
    <p>Ascending order:</p>
    <p id="asc"></p>
    <p>Descending order:</p>
    <p id="desc"></p>
    <script>let a = ['Anjala', 'Christeena', 'Blessey', 'Angela']; document.getElementById('original').textContent = a.join(', '); document.getElementById('asc').textContent = [...a].sort().join(', '); document.getElementById('desc').textContent = [...a].sort().reverse().join(', ')</script>
    <p><em>HTML/JavaScript equivalent; PHP print_r/asort/arsort are not run in a browser-only file.</em></p>
</body>

</html>
